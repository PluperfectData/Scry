name: API

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Scry/Server
    steps:
      # Scry.Api reaches Nexus four levels up from Server/src/Scry.Api, so both check out side by side.
      - uses: actions/checkout@v7
        with:
          path: Scry

      - uses: actions/checkout@v7
        with:
          repository: PluperfectData/Nexus
          path: Nexus

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: Scry/Server/global.json

      - run: dotnet restore Scry.slnx --locked-mode
      - run: dotnet build Scry.slnx -c Release --no-restore
      - run: dotnet test Scry.slnx -c Release --no-build
