# Scry for working on its code, in Docker: the API under dotnet run, the site under Vite's dev server, MySQL, and
# Mailpit, at the ports development uses, with Caddy serving the site and the API over HTTPS. The API and the site copy
# in the code as saved every time they start, so restarting one runs the latest code. "Scry Dev.cmd" on Windows, or
# scry-dev.sh on macOS and Linux, builds and starts it; run it again after changing a project or package file, or this
# file, since a restart keeps a container as it was made. These containers share nothing with compose.yaml's.
# compose.dev.both.yaml runs them beside Nexus's. By hand, every command takes --env-file .env.dev, where the launcher
# keeps the database's password.
name: pluperfect-data-dev
services:
  scry-db-dev:
    image: mysql:8.4
    container_name: scry-db-dev
    environment:
      MYSQL_DATABASE: scry
      MYSQL_USER: scry
      MYSQL_PASSWORD: ${SCRY_DEV_DB_PASSWORD:?The dev launcher sets SCRY_DEV_DB_PASSWORD in .env.dev; run it first}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      # For MySQL Workbench or the mysql client: user scry, with the password in .env.dev.
      - "127.0.0.1:6166:3306"
    volumes:
      - scry-database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      # MySQL's first start makes its database files, which can take several minutes.
      start_period: 10m

  scry-mail-dev:
    image: axllent/mailpit:v1.33
    container_name: scry-mail-dev
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:6162:8025"
    volumes:
      - scry-mail:/data

  scry-api-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: api
      additional_contexts:
        nexus: ../Nexus
        jwt: ../../Pluperfect.Jwt
        mail: ../../Pluperfect.Mail
    container_name: scry-api-dev
    depends_on:
      scry-db-dev:
        condition: service_healthy
      scry-mail-dev:
        condition: service_started
    environment:
      ConnectionStrings__Scry: Server=scry-db-dev;Port=3306;Database=scry;User ID=scry;Password=${SCRY_DEV_DB_PASSWORD}
      Scry__ClientOrigin: https://localhost:6160
      Scry__ApiOrigin: https://localhost:6161
      # Browsers reach the API only through scry-caddy-dev, so its forwarding headers say who asked and over what.
      Scry__Proxied: "true"
      Mail__MailpitUrl: http://scry-mail-dev:8025
      Scry__MailpitInbox: http://localhost:6162
    healthcheck:
      # A connection alone, since the API logs every request.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6161"]
      interval: 5s
      timeout: 5s
      retries: 30
      # dotnet run builds before the API starts, and a new database's first start can take several minutes.
      start_period: 10m
    # Copies in each project as saved, then runs the API, so every start or restart runs the latest code. Each project
    # keeps the container's own bin and obj, and the data folder that running from the code keeps is never copied.
    command:
      - bash
      - -c
      - >-
        set -euo pipefail;
        for p in Pluperfect.Data/Scry/Server/src/Scry.Api Pluperfect.Data/Nexus/Server/src/Nexus.Abstractions
        Pluperfect.Data/Nexus/Server/src/Nexus.Csv Pluperfect.Data/Nexus/Server/src/Nexus.DuckDb
        Pluperfect.Jwt/src/Pluperfect.Jwt Pluperfect.Mail/src/Pluperfect.Mail; do
        find "/src/$$p" -mindepth 1 -maxdepth 1 ! -name bin ! -name obj -exec rm -rf {} +;
        tar -C "/source/$$p" --exclude=./bin --exclude=./obj --exclude=./data --exclude=./Data -cf - . | tar -C "/src/$$p" -xf -;
        done;
        exec dotnet run --no-launch-profile --disable-build-servers
    volumes:
      - scry-data:/data
      # Read only at start, by the command above.
      - ./Server/src/Scry.Api:/source/Pluperfect.Data/Scry/Server/src/Scry.Api:ro
      - ../Nexus/Server/src/Nexus.Abstractions:/source/Pluperfect.Data/Nexus/Server/src/Nexus.Abstractions:ro
      - ../Nexus/Server/src/Nexus.Csv:/source/Pluperfect.Data/Nexus/Server/src/Nexus.Csv:ro
      - ../Nexus/Server/src/Nexus.DuckDb:/source/Pluperfect.Data/Nexus/Server/src/Nexus.DuckDb:ro
      - ../../Pluperfect.Jwt/src/Pluperfect.Jwt:/source/Pluperfect.Jwt/src/Pluperfect.Jwt:ro
      - ../../Pluperfect.Mail/src/Pluperfect.Mail:/source/Pluperfect.Mail/src/Pluperfect.Mail:ro

  scry-web-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: web
      additional_contexts:
        nexus: ../Nexus
        jwt: ../../Pluperfect.Jwt
        mail: ../../Pluperfect.Mail
    container_name: scry-web-dev
    environment:
      # Wins over .env.development's, since the page reaches the API through scry-caddy-dev.
      VITE_API_URL: https://localhost:6161
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6160/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 2m
    # Copies in the code as saved, then serves it, so every start or restart runs the latest code.
    command:
      - sh
      - -c
      - >-
        for p in src public index.html vite.config.ts .env.development; do rm -rf "$$p" && cp -a "/source/Client/$$p" "$$p" || exit 1; done
        && exec npm run dev -- --host 0.0.0.0
    volumes:
      # Read only at start, by the command above; node_modules stays the image's own.
      - ./Client:/source/Client:ro

  scry-caddy-dev:
    image: caddy:2.11
    container_name: scry-caddy-dev
    depends_on:
      scry-api-dev:
        condition: service_healthy
      scry-web-dev:
        condition: service_healthy
    ports:
      - "127.0.0.1:6160:6160"
      - "127.0.0.1:6161:6161"
    volumes:
      - ./deploy/docker/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - scry-caddy:/data
    healthcheck:
      # Healthy once Caddy has made the authority its certificates come from, which the launcher asks this computer
      # to trust.
      test: ["CMD", "test", "-f", "/data/caddy/pki/authorities/local/root.crt"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  scry-database:
    name: scry-dev-database
  scry-data:
    name: scry-dev-data
  scry-mail:
    name: scry-dev-mail
  scry-caddy:
    name: scry-dev-caddy
